name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: uv sync --locked --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python evals/run.py

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
      - run: uv sync --locked --dev
      - name: Build MCP Eval from main
        run: |
          cargo install --locked --git https://github.com/cavi-ai/mcp-eval --branch main \
            --root "$RUNNER_TEMP/mcp-eval" mcpeval
          echo "MCPEVAL_EXECUTABLE=$RUNNER_TEMP/mcp-eval/bin/mcpeval" >> "$GITHUB_ENV"
          revision=$(jq -r '.installs | keys[] | select(startswith("mcpeval "))' "$RUNNER_TEMP/mcp-eval/.crates2.json" \
            | sed -E 's/.*#([0-9a-f]{40})\)$/\1/')
          echo "MCPEVAL_SOURCE_REVISION=$revision" >> "$GITHUB_ENV"
      - run: uv run --locked python evals/probe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-eval-reports
          path: .tmp/evals/*/*.json
          if-no-files-found: error

  pin-consumers:
    needs: [check, evals]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: cavi-ai/mcp-core/.github/workflows/pin-consumers.yml@main
    with:
      consumers: '["game-art-pipeline"]'
    secrets:
      token: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
